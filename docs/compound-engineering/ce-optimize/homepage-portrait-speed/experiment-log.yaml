      expected_benefit: Reduce the largest responsive portrait payload from 2,816,355 bytes to at most 350,000 bytes (at least 87.6%); assumes the browser selects an appropriate WebP source from the generated srcset. Verify candidate selection after deployment.
      confidence: High that modern browsers will transfer fewer bytes if the generated variants meet the target and the live template emits them; visual fidelity and deployed HTML remain to be checked.
      cost_and_risk: One local ImageMagick conversion pass and visual/byte checks; no new dependencies or paid services. Low behavior risk because only two derived assets are added and PNG fallback/templates remain unchanged. Local Jekyll build is unavailable, so deployed HTML requires post-publish verification.
