name: Audit external links

# Internal links are checked against the built site in deploy.yml before upload.
# External hosts can rate-limit CI; keep this independent from release checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: --scheme https --scheme http --verbose --no-progress './_posts/**/*.md' './_pages/**/*.md'
