<script type="module">
const $=id=>document.getElementById(id),bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let session=0,key=null,photos=[],fullPhotos=new Map(),fullPromise=null,aborter=null,house=null,plan=null,photoMeta=null,active=0,opener=null,loading=false,fallbackUrl=null,fallbackUrls={};
const dialog=$('rcg-dialog'),form=$('rcg-form'),password=$('rcg-password'),button=$('rcg-unlock');
async function inflate(binary){return JSON.parse(await new Response(new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'))).text());}
function lock(){session++;aborter?.abort();house?.dispose();house=null;key=null;plan=null;photoMeta=null;fullPromise=null;loading=false;if(dialog.open)dialog.close();$('rcg-large').removeAttribute('src');$('rcg-large').alt='';$('rcg-gallery').replaceChildren();photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];fullPhotos.forEach(p=>URL.revokeObjectURL(p));fullPhotos.clear();Object.values(fallbackUrls).forEach(u=>URL.revokeObjectURL(u));fallbackUrls={};if(fallbackUrl)URL.revokeObjectURL(fallbackUrl);fallbackUrl=null;$('rcg-private').hidden=true;$('rcg-actions').hidden=true;form.hidden=false;password.value='';$('rcg-error').hidden=true;}
async function loadFull(){
 if(fullPromise)return fullPromise;const generation=session;aborter=new AbortController();
 fullPromise=(async()=>{const response=await fetch(photoMeta.path,{signal:aborter.signal});if(!response.ok)throw new Error('Photo download failed');const binary=await response.arrayBuffer();const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(photoMeta.iv)},key,binary);const data=await inflate(plain);if(session!==generation)return;for(const p of data.photos)fullPhotos.set(p.id,URL.createObjectURL(new Blob([bytes(p.image)],{type:'image/webp'})));})();
 try{await fullPromise;}catch(e){if(session===generation)fullPromise=null;throw e;}
}
async function showPhoto(id){
 const index=typeof id==='number'?((id+photos.length)%photos.length):photos.findIndex(p=>p.id===id);if(index<0||!photos.length)return;active=index;const p=photos[active];$('rcg-large').src=fullPhotos.get(p.id)||p.url;$('rcg-large').alt=p.caption;$('rcg-caption').textContent=`${p.id} · ${p.caption}`;$('rcg-photo-position').textContent=`${active+1} / ${photos.length}${fullPhotos.has(p.id)?'':' · Loading full photo…'}`;
 if(!dialog.open)dialog.showModal();const generation=session;
 try{await loadFull();if(session===generation&&dialog.open&&photos[active]?.id===p.id){$('rcg-large').src=fullPhotos.get(p.id)||p.url;$('rcg-photo-position').textContent=`${active+1} / ${photos.length}`;}}catch(e){if(session===generation&&dialog.open)$('rcg-photo-position').textContent='Full photo unavailable. Close and reopen to retry.';}
}
function buildGallery(){const groups=new Map();photos.forEach(p=>{if(!groups.has(p.section)){const section=document.createElement('section');section.className='rcg-photo-section';const title=document.createElement('h3');title.textContent=p.section;const grid=document.createElement('div');grid.className='rcg-photo-grid';section.append(title,grid);$('rcg-gallery').append(section);groups.set(p.section,grid);}const fig=document.createElement('figure'),b=document.createElement('button'),im=document.createElement('img'),cap=document.createElement('figcaption');b.type='button';b.setAttribute('aria-label',`View photo ${p.id}: ${p.caption}`);im.src=p.url;im.alt=p.caption;im.width=p.width;im.height=p.height;im.loading='lazy';cap.textContent=`${p.id} · ${p.caption}`;b.append(im);b.addEventListener('click',()=>{opener=b;showPhoto(p.id);});fig.append(b,cap);groups.get(p.section).append(fig);});}
form.addEventListener('submit',async e=>{
 e.preventDefault();if(loading)return;loading=true;const generation=++session;button.disabled=true;button.textContent='Unlocking…';$('rcg-error').hidden=true;
 try{
  if(!crypto.subtle||!window.DecompressionStream)throw new Error('Use a current browser over HTTPS to unlock this page.');
  const cfg=JSON.parse($('rcg-encrypted-data').textContent),material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);password.value='';
  key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(cfg.salt),iterations:cfg.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  let data;try{const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(cfg.iv)},key,bytes(cfg.ciphertext));data=await inflate(plain);}catch(e){throw new Error('Incorrect password. Please try again.');}
  if(session!==generation)return;plan=data.house;photoMeta=data.gallery;photos=data.photos.map(p=>({...p,url:URL.createObjectURL(new Blob([bytes(p.image)],{type:'image/webp'})),image:undefined}));fallbackUrl=URL.createObjectURL(new Blob([bytes(data.fallback||data.fallbackPlans['0'])],{type:'image/png'}));fallbackUrls=Object.fromEntries(Object.entries(data.fallbackPlans||{}).map(([level,binary])=>[level,URL.createObjectURL(new Blob([bytes(binary)],{type:'image/png'}))]));data=null;form.hidden=true;$('rcg-private').hidden=false;$('rcg-actions').hidden=false;
  const started=performance.now();try{const module=await import('/assets/rcg/viewer.min.js?v=3f441eaa2aa9');if(session!==generation)return;house=module.mountHouse($('rcg-house'),plan,photos,{onPhoto:showPhoto,fallbackUrl,fallbackUrls});$('rcg-house').dataset.startupMs=Math.round(performance.now()-started);}catch(e){$('rcg-house').textContent='The 3D viewer could not load. You can still explore the Photos tab.';console.error('RCG viewer:',e.message);}
  buildGallery();tab('house');
 }catch(e){key=null;$('rcg-error').textContent=e.message;$('rcg-error').hidden=false;password.focus();}
 finally{loading=false;password.value='';button.disabled=false;button.textContent='Unlock';}
});
function tab(which){$('rcg-house').hidden=which!=='house';$('rcg-photos').hidden=which!=='photos';$('rcg-tab-house').setAttribute('aria-pressed',String(which==='house'));$('rcg-tab-photos').setAttribute('aria-pressed',String(which==='photos'));}
$('rcg-tab-house').addEventListener('click',()=>tab('house'));$('rcg-tab-photos').addEventListener('click',()=>tab('photos'));$('rcg-lock').addEventListener('click',()=>{lock();password.focus();});$('rcg-close').addEventListener('click',()=>dialog.close());$('rcg-previous').addEventListener('click',()=>showPhoto(active-1));$('rcg-next').addEventListener('click',()=>showPhoto(active+1));dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();showPhoto(active+(e.key==='ArrowRight'?1:-1));}});dialog.addEventListener('close',()=>{$('rcg-large').removeAttribute('src');opener?.focus();});window.addEventListener('pagehide',lock);
</script>
