<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RCG / house preview</title><style>body{margin:0;padding:24px;background:#fffef9}@media(max-width:650px){body{padding:14px}}</style></head><body><style>
.rcg-house-page{--rcg-ink:#283b38;--rcg-muted:#67736a;--rcg-paper:#f5f3eb;--rcg-line:#d6d9ce;--rcg-green:#365c4b;color:var(--rcg-ink);max-width:1320px;margin:0 auto 3rem;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
.rcg-house-page *{box-sizing:border-box}.rcg-house-page [hidden]{display:none!important}.rcg-house-page button,.rcg-house-page select,.rcg-house-page input{font:inherit}.rcg-house-page button,.rcg-house-page select{color:var(--rcg-ink);border:1px solid var(--rcg-line);background:#fffef9;border-radius:6px;padding:9px 14px;cursor:pointer;min-height:42px}.rcg-house-page button:hover{background:#e8ede1}.rcg-house-page button:focus-visible,.rcg-house-page select:focus-visible,.rcg-house-page input:focus-visible{outline:3px solid #8aab85;outline-offset:3px}.rcg-house-page button:disabled{opacity:.6;cursor:wait}
.rcg-public-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:1rem 0 1.5rem}.rcg-public-header h1{font:400 2.5rem Georgia,serif;margin:0;letter-spacing:-.04em;color:var(--rcg-ink)}.rcg-public-header p{margin:2px 0 0;color:var(--rcg-muted);font-size:.9rem}.rcg-session-actions{display:flex;gap:8px;flex-wrap:wrap}.rcg-session-actions button[aria-pressed=true]{background:var(--rcg-green);color:white;border-color:var(--rcg-green)}
.rcg-unlock-panel{max-width:590px;padding:2rem;background:var(--rcg-paper);border:1px solid var(--rcg-line);border-radius:12px;margin:3rem auto 5rem}.rcg-unlock-panel h2{font:400 1.8rem Georgia,serif;color:var(--rcg-ink);margin:0 0 1rem}.rcg-unlock-panel label{display:block;margin-bottom:6px}.rcg-unlock-fields{display:flex;gap:8px}.rcg-unlock-fields input{min-width:0;flex:1;width:100%;border:1px solid #b8c2b4;border-radius:5px;background:#fffef9;padding:10px;color:var(--rcg-ink)}.rcg-unlock-fields button,.rcg-house-page .house-tour{background:var(--rcg-green);color:white;border-color:var(--rcg-green)}.rcg-lock-note{font-size:.84rem;color:var(--rcg-muted);margin:1rem 0 0}.rcg-error{color:#943b34;margin:.75rem 0 0}
.house-header{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--rcg-paper);padding:24px 26px 20px;border-radius:12px 12px 0 0;border:1px solid var(--rcg-line);border-bottom:0}.house-eyebrow{font-size:.65rem!important;font-weight:650;letter-spacing:.15em;color:var(--rcg-muted);margin:0 0 8px;text-transform:uppercase}.house-header h2{font:400 clamp(1.65rem,3vw,2.35rem) Georgia,serif;color:var(--rcg-ink);margin:0;letter-spacing:-.035em}.house-subtitle{font-size:.82rem;margin:8px 0 0;color:var(--rcg-muted)}.house-tools{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--rcg-paper);padding:12px 22px;border:1px solid var(--rcg-line)}.house-modes{display:flex;gap:5px;flex-wrap:wrap}.house-modes button{font-size:.8rem;padding:7px 11px;min-height:38px}.house-modes button[aria-pressed=true]{background:var(--rcg-green);color:#fff;border-color:var(--rcg-green)}.house-filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.8rem}.house-filters label{display:flex;gap:6px;align-items:center;margin:0}.house-filters select{font-size:.8rem;padding:7px 8px;min-height:37px}.house-filters input{accent-color:var(--rcg-green);width:15px;height:15px}
.house-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;border:1px solid var(--rcg-line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden;background:var(--rcg-paper)}.house-stage{position:relative;min-width:0;height:590px;overflow:hidden;background:#dfdfd1}.house-canvas{width:100%;height:100%}.house-canvas canvas{display:block;width:100%;height:100%;touch-action:none}.house-canvas>img{width:100%;height:100%;object-fit:contain}.house-info{padding:25px 22px;border-left:1px solid var(--rcg-line);min-width:0}.house-info>label{font-size:.75rem;display:block;margin-bottom:6px}.house-info>select{width:100%;font-size:.8rem;padding:9px 7px}.house-info h3{font:400 1.5rem Georgia,serif;letter-spacing:-.025em;color:var(--rcg-ink);margin:24px 0 12px}.house-room-note{font-size:.83rem;color:#536459;margin:0}.house-route{margin:20px 0}.house-tour{width:100%;font-size:.85rem!important}.house-tour-nav{display:flex;align-items:center;justify-content:space-between;gap:5px}.house-tour-nav button{font-size:.75rem;padding:7px 10px}.house-tour-position{font-size:.72rem;color:var(--rcg-muted);white-space:nowrap}.house-reference-grid{display:flex;flex-wrap:wrap;gap:8px}.house-reference-grid button{width:calc(50% - 4px);padding:0;position:relative;border:0;overflow:hidden;border-radius:5px;min-height:60px}.house-reference-grid img{width:100%;height:78px;object-fit:cover;display:block}.house-reference-grid span{position:absolute;left:5px;bottom:4px;color:white;background:#21372bb3;font-size:.65rem;padding:0 4px;border-radius:2px}.house-notes{margin-top:24px;border-top:1px solid var(--rcg-line);padding-top:15px;font-size:.75rem;color:var(--rcg-muted)}.house-notes summary{cursor:pointer;color:var(--rcg-ink)}.house-notes p{margin:10px 0}.house-notes button{font-size:.72rem;padding:7px}.house-performance{display:block;margin-top:12px;font-size:.64rem}.house-assumption{font-size:.75rem;color:#877247}.house-gesture{position:absolute;bottom:12px;left:15px;right:15px;font-size:.68 .rcg-gallery-intro{display:flex;gap:1rem;align-items:center;justify-content:space-between;margin-bottom:1.4rem}.rcg-gallery-intro h2{font:400 1.8rem Georgia,serif;color:var(--rcg-ink)}.rcg-photo-status{font-size:.8rem;color:var(--rcg-muted)}.rcg-photo-section{margin:2rem 0}.rcg-photo-section h3{font:400 1.35rem Georgia,serif;color:var(--rcg-ink)}.rcg-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.rcg-photo-grid figure{margin:0;min-width:0}.rcg-photo-grid button{display:block;width:100%;border:0;padding:0;overflow:hidden;border-radius:6px}.rcg-photo-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.rcg-photo-grid figcaption{font-size:.75rem;color:var(--rcg-muted);margin-top:7px}.rcg-dialog{box-sizing:border-box;width:min(1080px,calc(100% - 20px));max-width:calc(100% - 20px);max-height:95dvh;margin:auto;padding:16px;border:0;border-radius:10px;background:#f5f3eb;color:#283b38;font-family:system-ui,sans-serif}.rcg-dialog::backdrop{background:#14251de8}.rcg-dialog:not([open]){display:none}.rcg-dialog header,.rcg-dialog footer{display:flex;gap:12px;align-items:center;justify-content:space-between}.rcg-dialog header p{margin:0;font-size:.95rem;min-width:0;overflow-wrap:anywhere}.rcg-dialog header button{flex-shrink:0}.rcg-dialog img{display:block;max-width:100%;height:auto;max-height:72dvh;object-fit:contain;margin:14px auto}.rcg-dialog button{border:1px solid #cbd2c4;background:#fffef9;color:#283b38;border-radius:5px;padding:8px 13px;font:inherit}.rcg-dialog footer span{font-size:.75rem;color:#67736a}

@media(prefers-reduced-motion:reduce){.rcg-house-page *{scroll-behavior:auto}}

const dialog=$('rcg-dialog'),form=$('rcg-form'),password=$('rcg-password'),button=$('rcg-unlock');
async function inflate(binary){return JSON.parse(await new Response(new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'))).text());}
function lock(){session++;aborter?.abort();house?.dispose();house=null;key=null;plan=null;photoMeta=null;fullPromise=null;loading=false;if(dialog.open)dialog.close();$('rcg-large').removeAttribute('src');$('rcg-large').alt='';$('rcg-gallery').replaceChildren();photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];fullPhotos.forEach(p=>URL.revokeObjectURL(p));fullPhotos.clear();Object.values(fallbackUrls).forEach(u=>URL.revokeObjectURL(u));fallbackUrls={};if(fallbackUrl)URL.revokeObjectURL(fallbackUrl);fallbackUrl=null;$('rcg-private').hidden=true;$('rcg-actions').hidden=true;form.hidden=false;password.value='';$('rcg-error').hidden=true;}
async function loadFull(){
 if(fullPromise)return fullPromise;const generation=session;aborter=new AbortController();
 fullPromise=(async()=>{const response=await fetch(photoMeta.path,{signal:aborter.signal});if(!response.ok)throw new Error('Photo download failed');const binary=await response.arrayBuffer();const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(photoMeta.iv)},key,binary);const data=await inflate(plain);if(session!==generation)return;for(const p of data.photos)fullPhotos.set(p.id,URL.createObjectURL(new Blob([bytes(p.image)],{type:'image/webp'})));})();
 try{await fullPromise;}catch(e){if(session===generation)fullPromise=null;throw e;}
}
async function showPhoto(id){
 const index=typeof id==='number'?((id+photos.length)%photos.length):photos.findIndex(p=>p.id===id);if(index<0||!photos.length)return;active=index;const p=photos[active];$('rcg-large').src=fullPhotos.get(p.id)||p.url;$('rcg-large').alt=p.caption;$('rcg-caption').textContent=`${p.id} · ${p.caption}`;$('rcg-photo-position').textContent=`${active+1} / ${photos.length}${fullPhotos.has(p.id)?'':' · Loading full photo…'}`;
 if(!dialog.open)dialog.showModal();const generation=session;
 try{await loadFull();if(session===generation&&dialog.open&&photos[active]?.id===p.id){$('rcg-large').src=fullPhotos.get(p.id)||p.url;$('rcg-photo-position').textContent=`${active+1} / ${photos.length}`;}}catch(e){if(session===generation&&dialog.open)$('rcg-photo-position').textContent='Full photo unavailable. Close and reopen to retry.';}
}
function buildGallery(){const groups=new Map();photos.forEach(p=>{if(!groups.has(p.section)){const section=document.createElement('section');section.className='rcg-photo-section';const title=document.createElement('h3');title.textContent=p.section;const grid=document.createElement('div');grid.className='rcg-photo-grid';section.append(title,grid);$('rcg-gallery').append(section);groups.set(p.section,grid);}const fig=document.createElement('figure'),b=document.createElement('button'),im=document.createElement('img'),cap=document.createElement('figcaption');b.type='button';b.setAttribute('aria-label',`View photo ${p.id}: ${p.caption}`);im.src=p.url;im.alt=p.caption;im.width=p.width;im.height=p.height;im.loading='lazy';cap.textContent=`${p.id} · ${p.caption}`;b.append(im);b.addEventListener('click',()=>{opener=b;showPhoto(p.id);});fig.append(b,cap);groups.get(p.section).append(fig);});}
form.addEventListener('submit',async e=>{
 e.preventDefault();if(loading)return;loading=true;const generation=++session;button.disabled=true;button.textContent='Unlocking…';$('rcg-error').hidden=true;
 try{
  if(!crypto.subtle||!window.DecompressionStream)throw new Error('Use a current browser over HTTPS to unlock this page.');
  const cfg=JSON.parse($('rcg-encrypted-data').textContent),material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);password.value='';
  key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(cfg.salt),iterations:cfg.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  let data;try{const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(cfg.iv)},key,bytes(cfg.ciphertext));data=await inflate(plain);}catch(e){throw new Error('Incorrect password. Please try again.');}
  if(session!==generation)return;plan=data.house;photoMeta=data.gallery;photos=data.photos.map(p=>({...p,url:URL.createObjectURL(new Blob([bytes(p.image)],{type:'image/webp'})),image:undefined}));fallbackUrl=URL.createObjectURL(new Blob([bytes(data.fallback||data.fallbackPlans['0'])],{type:'image/png'}));fallbackUrls=Object.fromEntries(Object.entries(data.fallbackPlans||{}).map(([level,binary])=>[level,URL.createObjectURL(new Blob([bytes(binary)],{type:'image/png'}))]));data=null;form.hidden=true;$('rcg-private').hidden=false;$('rcg-actions').hidden=false;
  const started=performance.now();try{const module=await import('/assets/rcg/viewer.min.js?v=62bd036c1680');if(session!==generation)return;house=module.mountHouse($('rcg-house'),plan,photos,{onPhoto:showPhoto,fallbackUrl,fallbackUrls});$('rcg-house').dataset.startupMs=Math.round(performance.now()-started);}catch(e){$('rcg-house').textContent='The 3D viewer could not load. You can still explore the Photos tab.';console.error('RCG viewer:',e.message);}
  buildGallery();tab('house');
 }catch(e){key=null;$('rcg-error').textContent=e.message;$('rcg-error').hidden=false;password.focus();}
 finally{loading=false;password.value='';button.disabled=false;button.textContent='Unlock';}
});
function tab(which){$('rcg-house').hidden=which!=='house';$('rcg-photos').hidden=which!=='photos';$('rcg-tab-house').setAttribute('aria-pressed',String(which==='house'));$('rcg-tab-photos').setAttribute('aria-pressed',String(which==='photos'));}
$('rcg-tab-house').addEventListener('click',()=>tab('house'));$('rcg-tab-photos').addEventListener('click',()=>tab('photos'));$('rcg-lock').addEventListener('click',()=>{lock();password.focus();});$('rcg-close').addEventListener('click',()=>dialog.close());$('rcg-previous').addEventListener('click',()=>showPhoto(active-1));$('rcg-next').addEventListener('click',()=>showPhoto(active+1));dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();showPhoto(active+(e.key==='ArrowRight'?1:-1));}});dialog.addEventListener('close',()=>{$('rcg-large').removeAttribute('src');opener?.focus();});window.addEventListener('pagehide',lock);
</script>
</body></html>
